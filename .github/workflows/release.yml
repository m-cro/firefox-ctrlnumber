name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check tag matches manifest and package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version src/manifest.json)
          pkg=$(jq -r .version package.json)
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$pkg" ]; then
            echo "Version mismatch: tag=$tag manifest=$manifest package=$pkg"; exit 1
          fi
      - run: bun run test
      - run: bun run build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes web-ext-artifacts/*.zip
