name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check tag matches manifest and package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version src/manifest.json)
          pkg=$(jq -r .version package.json)
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$pkg" ]; then
            echo "Version mismatch: tag=$tag manifest=$manifest package=$pkg"; exit 1
          fi
      - run: bun run test
      - run: bun run build
      - name: Sign for AMO (self-distributed .xpi)
        if: ${{ env.AMO_JWT_ISSUER != '' }}
        run: >
          bunx web-ext sign --channel=unlisted --source-dir src
          --artifacts-dir web-ext-artifacts
          --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes web-ext-artifacts/*
